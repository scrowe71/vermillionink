name: Only from dev

# Pull requests into main must come from the dev branch.
on:
  pull_request:
    branches: [main]

jobs:
  only-from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::main only accepts changes from dev (this PR is from '${{ github.head_ref }}')."
            exit 1
          fi
          echo "Source branch is dev - OK."
